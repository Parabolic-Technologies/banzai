name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      live_compatibility:
        description: Run live vendor compatibility on the dedicated protected runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release_check_node_22:
    runs-on: ubuntu-24.04
    container: node:22.20.0-bookworm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: git --version
      - run: python3 --version
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: scope
        run: |
          if git show HEAD^1:packages/orchestrator/scripts/verification-scope.mjs > "$RUNNER_TEMP/verification-scope.mjs"; then
            node "$RUNNER_TEMP/verification-scope.mjs" --ci
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            printf '%s\n' '## Verification scope: full' '' '```text' 'Reason: the base revision has no scope rules' '```' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm ci
      - run: npm run release:check
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
      - id: release_evidence
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
        run: node packages/orchestrator/scripts/release-evidence.mjs record
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
        with:
          name: ${{ steps.release_evidence.outputs.name }}
          path: ${{ steps.release_evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - run: npm run check -- --base HEAD^1
        if: steps.scope.outputs.scope == 'documents' || steps.scope.outputs.scope == 'plugin'

  release_check_node_24:
    runs-on: ubuntu-24.04
    container: node:24.11.1-bookworm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: git --version
      - run: python3 --version
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: scope
        run: |
          if git show HEAD^1:packages/orchestrator/scripts/verification-scope.mjs > "$RUNNER_TEMP/verification-scope.mjs"; then
            node "$RUNNER_TEMP/verification-scope.mjs" --ci
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            printf '%s\n' '## Verification scope: full' '' '```text' 'Reason: the base revision has no scope rules' '```' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm ci
      - run: npm run release:check
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
      - id: release_evidence
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
        run: node packages/orchestrator/scripts/release-evidence.mjs record
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
        with:
          name: ${{ steps.release_evidence.outputs.name }}
          path: ${{ steps.release_evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - run: npm run check -- --base HEAD^1
        if: steps.scope.outputs.scope == 'documents' || steps.scope.outputs.scope == 'plugin'

  release_check_node_26:
    runs-on: ubuntu-24.04
    container: node:26.13.0-bookworm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: git --version
      - run: python3 --version
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: scope
        run: |
          if git show HEAD^1:packages/orchestrator/scripts/verification-scope.mjs > "$RUNNER_TEMP/verification-scope.mjs"; then
            node "$RUNNER_TEMP/verification-scope.mjs" --ci
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            printf '%s\n' '## Verification scope: full' '' '```text' 'Reason: the base revision has no scope rules' '```' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm ci
      - run: npm run release:check
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
      - id: release_evidence
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
        run: node packages/orchestrator/scripts/release-evidence.mjs record
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.scope != 'documents' && steps.scope.outputs.scope != 'plugin'
        with:
          name: ${{ steps.release_evidence.outputs.name }}
          path: ${{ steps.release_evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - run: npm run check -- --base HEAD^1
        if: steps.scope.outputs.scope == 'documents' || steps.scope.outputs.scope == 'plugin'

  live_vendor_compatibility:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.live_compatibility == true &&
      github.ref_protected == true &&
      vars.BANZAI_LIVE_COMPATIBILITY == '1'
    runs-on: [self-hosted, linux, banzai-live]
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - run: git --version
      - run: npm ci
      - run: npm run build:dist
      - run: npm run compatibility:live -- --confirm-live
