name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      live_compatibility:
        description: Run live vendor compatibility on the dedicated protected runner
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release_check_node_22:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container: node:22.20.0-bookworm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git --version
      - run: python3 --version
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run release:check
      - id: release_evidence
        run: node packages/orchestrator/scripts/release-evidence.mjs record
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release_evidence.outputs.name }}
          path: ${{ steps.release_evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  release_check_node_24:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container: node:24.11.1-bookworm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git --version
      - run: python3 --version
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run release:check
      - id: release_evidence
        run: node packages/orchestrator/scripts/release-evidence.mjs record
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release_evidence.outputs.name }}
          path: ${{ steps.release_evidence.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  forward_compatibility_node_26:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container: node:26.7.0-bookworm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git --version
      - run: python3 --version
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run release:check

  live_vendor_compatibility:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.live_compatibility == true &&
      github.ref_protected == true &&
      vars.BANZAI_LIVE_COMPATIBILITY == '1'
    runs-on: [self-hosted, linux, banzai-live]
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - run: git --version
      - run: npm ci
      - run: npm run compatibility:live -- --confirm-live
