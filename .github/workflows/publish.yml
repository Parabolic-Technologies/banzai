name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish_npm:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE: "@parabolic-technologies/banzai"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Confirm the release tag matches the source version and npm supports trusted publishing
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          node - "$(npm --version)" <<'CHECK'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);
          const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!supported) {
            console.error(`npm ${process.argv[2]} is older than 11.5.1, which trusted publishing requires`);
            process.exit(1);
          }
          CHECK
      - run: git --version
      - run: npm ci
      - run: npm run release:check
      - name: Skip versions that already exist on the registry
        id: registry
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE@$version" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$version already exists on the registry; the publish step is skipped"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the CLI workspace through npm trusted publishing
        if: steps.registry.outputs.published == 'false'
        run: npm publish --ignore-scripts --workspace "$PACKAGE" --access public --registry https://registry.npmjs.org/
      - name: Verify the registry document and record delivery facts
        env:
          BANZAI_REGISTRY_WAIT_SECONDS: "300"
          BANZAI_REGISTRY_POLL_SECONDS: "10"
        run: |
          version="$(node -p "require('./package.json').version")"
          node --input-type=module - "$PACKAGE" "$version" <<'VERIFY' >> "$GITHUB_STEP_SUMMARY"
          const [name, version] = process.argv.slice(2);
          const waitSeconds = Number(process.env.BANZAI_REGISTRY_WAIT_SECONDS ?? "300");
          const pollSeconds = Number(process.env.BANZAI_REGISTRY_POLL_SECONDS ?? "10");
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}`;
          const deadline = Date.now() + waitSeconds * 1000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          // The registry document is served through a CDN and can lag a publish
          // by minutes, so poll until the version and its latest tag are visible.
          let doc;
          for (;;) {
            let reason;
            try {
              const response = await fetch(url, {
                cache: "no-store",
                headers: { "cache-control": "no-cache" },
              });
              if (response.ok) {
                doc = await response.json();
                const entry = doc.versions?.[version];
                const latest = doc["dist-tags"]?.latest;
                if (entry && latest === version) break;
                reason = entry
                  ? `dist-tags.latest is ${latest}, expected ${version}`
                  : `${name}@${version} is not in the registry document yet`;
              } else {
                reason = `registry responded ${response.status}`;
              }
            } catch (error) {
              reason = `registry request failed: ${error.message}`;
            }
            if (Date.now() >= deadline) {
              console.error(`${reason} after waiting ${waitSeconds}s`);
              process.exit(1);
            }
            console.error(`${reason}; retrying in ${pollSeconds}s`);
            await sleep(pollSeconds * 1000);
          }
          const entry = doc.versions[version];
          console.log(`## ${doc.name}@${version}`);
          console.log(`- published: ${doc.time[version]}`);
          console.log(`- shasum: ${entry.dist.shasum}`);
          console.log(`- integrity: ${entry.dist.integrity}`);
          console.log(`- gitHead: ${entry.gitHead}`);
          console.log(`- provenance: ${entry.dist.attestations ? "attested" : "none; npm attaches provenance only for public repositories"}`);
          VERIFY
